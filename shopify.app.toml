# Конфігурація Shopify-застосунку (Shopify CLI). Заповнюється на етапі 2:
# `npm run shopify -- app config link` після створення застосунку в Shopify Dev Dashboard
# (Custom Distribution, магазин onetunne.com).
client_id = ""
name = "ONE TUNNE Logistics"
application_url = "https://example.com"
embedded = true

[access_scopes]
# Мінімальні дозволи етапу 2 (той самий список — у версії застосунку в Dev Dashboard і в змінній SCOPES):
#   write_orders    — читання замовлень і оновлення адреси/email/телефону (orderUpdate); включає read_orders
#   read_products   — товари, варіанти, фото, метаполе митного опису; етап 5 — колекції (ручні й автоматичні) і
#                     товари в них для шаблонів комплектації (Collection, Product.collections, webhooks collections/*)
#   read_inventory  — залишки, вага, HS-код, країна походження (InventoryItem)
# Етап 3:
#   write_merchant_managed_fulfillment_orders — виконання замовлення з трек-номером після передачі перевізнику
#                                               (fulfillmentCreate; включає read_)
#   write_shipping  — розрахунок доставки в Checkout (carrierServiceCreate/Update/Delete; включає read_shipping)
# Етап 5:
#   write_inventory — передача внутрішніх змін складу (надходження, брак, коригування) у Shopify дельтою
#                     (inventoryAdjustQuantities) і «надіслати значення складу» для розбіжностей; включає read_inventory.
#                     Без нього звірка працює (read_inventory), а передача — ні (рухи позначаються skipped).
#                     Передача ввімкнеться лише після налаштування власника (Склад → shopifyPush = deltas; типово вимкнено).
# Необов'язково: read_all_orders — імпорт замовлень старших за 60 днів.
scopes = "write_orders,read_products,read_inventory,write_inventory,write_merchant_managed_fulfillment_orders,write_shipping"

[auth]
redirect_urls = ["https://example.com/auth/callback"]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

[build]
automatically_update_urls_on_dev = true
